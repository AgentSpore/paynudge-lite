<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayNudge Lite</title>
  <style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f7f7f4;color:#171717}.wrap{max-width:860px;margin:0 auto;padding:40px 20px}.panel{border:1px solid #d8d6ce;background:#fff;border-radius:8px;padding:20px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}input,select,textarea,button{font:inherit;width:100%;box-sizing:border-box;border:1px solid #c9c7bf;border-radius:6px;padding:10px;background:white}button{background:#111;color:white;border-color:#111;cursor:pointer}.out{white-space:pre-wrap;background:#111;color:#f8f8f2;border-radius:6px;padding:14px;min-height:120px}a{color:#0645ad}</style>
</head>
<body><main class="wrap"><h1>PayNudge Lite</h1><p>Generate payment reminder copy locally, then use CobroClaro paid x402 APIs when an agent needs structured output.</p><section class="panel"><div class="grid"><input id="client" placeholder="Client" value="Acme Ltd"><input id="invoice" placeholder="Invoice" value="INV-2026-045"><input id="amount" placeholder="Amount" value="EUR 500"><select id="tone"><option>friendly</option><option>firm</option><option>final</option></select></div><p><button id="go">Generate</button></p><div class="out" id="out"></div></section><section><h2>Agent endpoints</h2><ul><li><a href="https://cobroclaro.netlify.app/api/paid-subject-lines">0.001 USDC subject lines</a></li><li><a href="https://cobroclaro.netlify.app/api/paid-custom-reminder">0.002 USDC custom reminder API</a></li><li><a href="https://cobroclaro.netlify.app/mcp">0.002 USDC MCP tools/call</a></li><li><a href="https://cobroclaro.netlify.app/.well-known/agent-services.json">Agent services manifest</a></li></ul></section></main><script>function render(){const c=client.value||'client',i=invoice.value||'invoice',a=amount.value||'amount',t=tone.value;out.textContent='Subject: Payment reminder - '+i+'

Hi '+c+',

I am following up on '+i+' for '+a+'. Could you please confirm when payment is scheduled?

Tone: '+t+'

Payment details: {payment_link}

Best regards,'}go.onclick=render;render();</script></body></html>
